[project]
name = "board-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kikikabachok-pixel", email = "kikikabachok@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
